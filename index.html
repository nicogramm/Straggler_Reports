<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Lab Test Processor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .drop-zone {
            margin: 40px;
            padding: 60px;
            border: 3px dashed #667eea;
            border-radius: 10px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .drop-zone:hover {
            background: #eef1ff;
            border-color: #764ba2;
        }

        .drop-zone.dragover {
            background: #e0e7ff;
            border-color: #4f46e5;
            transform: scale(1.02);
        }

        .drop-zone-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .drop-zone h2 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .drop-zone p {
            color: #666;
        }

        .processing {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            padding: 40px;
        }

        .success-message {
            background: #10b981;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }

        .success-message h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h4 {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 2.5em;
            font-weight: bold;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-block;
            text-decoration: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Excel Lab Test Processor</h1>
            <p>I-drag and drop ang Excel file o mag-click para mag-upload</p>
        </div>

        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">📁</div>
            <h2>I-drop ang Excel file dito</h2>
            <p>o mag-click para pumili ng file</p>
            <input type="file" id="fileInput" accept=".xlsx,.xls">
        </div>

        <div class="processing" id="processing">
            <div class="spinner"></div>
            <h3>Pinoproseso ang file...</h3>
            <p>Sandali lang...</p>
        </div>

        <div class="results" id="results">
            <div class="success-message">
                <h3>✅ Matagumpay na na-process!</h3>
                <p>Ang file ay automatic na na-download</p>
            </div>

            <div class="stats" id="stats"></div>

            <div style="text-align: center; margin-top: 30px;">
                <button class="btn" onclick="location.reload()">Mag-process ng Isa Pang File</button>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const processing = document.getElementById('processing');
        const results = document.getElementById('results');
        const stats = document.getElementById('stats');

        // Click to upload
        dropZone.addEventListener('click', () => fileInput.click());

        // Drag and drop events
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.name.match(/\.(xlsx|xls)$/)) {
                alert('Mangyaring mag-upload ng Excel file (.xlsx o .xls)');
                return;
            }

            dropZone.style.display = 'none';
            processing.style.display = 'block';

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    processExcel(e.target.result);
                } catch (error) {
                    alert('Error sa pag-process ng file: ' + error.message);
                    location.reload();
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function processExcel(data) {
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);

            // Filter valid data rows (exclude summary rows)
            const validData = jsonData.filter(row => 
                row.SETNAME && 
                row['LAB#'] && 
                typeof row['LAB#'] === 'number' &&
                row.STATUS
            );

            // Create new workbook
            const newWorkbook = XLSX.utils.book_new();

            // 1. Filter STATUS = "P"
            const statusP = validData.filter(row => row.STATUS === 'P');
            if (statusP.length > 0) {
                const ws = XLSX.utils.json_to_sheet(statusP);
                addSummary(ws, statusP, statusP.length + 2);
                XLSX.utils.book_append_sheet(newWorkbook, ws, 'STATUS_P');
            }

            // 2. Extract all unique tests from TESTS column
            const testSet = new Set();
            validData.forEach(row => {
                if (row.TESTS && typeof row.TESTS === 'string') {
                    const tests = row.TESTS.split(',').map(t => t.trim()).filter(t => t.length > 0);
                    tests.forEach(test => testSet.add(test));
                }
            });

            // 3. Create sheet for each test
            const testStats = {};
            testSet.forEach(testName => {
                const testRows = validData.filter(row => {
                    if (!row.TESTS || typeof row.TESTS !== 'string') return false;
                    const tests = row.TESTS.split(',').map(t => t.trim());
                    return tests.includes(testName);
                });

                if (testRows.length > 0) {
                    const ws = XLSX.utils.json_to_sheet(testRows);
                    addSummary(ws, testRows, testRows.length + 2);
                    
                    // Sanitize sheet name (max 31 chars, no special chars)
                    let sheetName = testName.substring(0, 31).replace(/[:\\\/\?\*\[\]]/g, '_');
                    XLSX.utils.book_append_sheet(newWorkbook, ws, sheetName);
                    
                    testStats[testName] = testRows.length;
                }
            });

            // Download the file
            XLSX.writeFile(newWorkbook, 'Processed_Lab_Tests.xlsx');

            // Show results
            processing.style.display = 'none';
            results.style.display = 'block';

            // Display statistics
            displayStats(statusP.length, testStats);
        }

        function addSummary(worksheet, data, startRow) {
            // Count total rows
            const totalRows = data.length;
            
            // Count by STATUS
            const statusCount = {};
            data.forEach(row => {
                const status = row.STATUS || 'Unknown';
                statusCount[status] = (statusCount[status] || 0) + 1;
            });

            // Count by CUSTOMER
            const customerCount = {};
            data.forEach(row => {
                const customer = row.CUSTOMER || 'Unknown';
                customerCount[customer] = (customerCount[customer] || 0) + 1;
            });

            // Add summary section
            const summaryData = [
                {},
                { A: '═══════════════ SUMMARY ═══════════════' },
                {},
                { A: 'KABUUANG BILANG NG ROWS:', B: totalRows },
                {},
                { A: '--- STATUS BREAKDOWN ---' }
            ];

            Object.entries(statusCount).forEach(([status, count]) => {
                summaryData.push({ A: `  ${status}:`, B: count });
            });

            summaryData.push({});
            summaryData.push({ A: '--- TOP 5 CUSTOMERS ---' });

            const topCustomers = Object.entries(customerCount)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            topCustomers.forEach(([customer, count]) => {
                summaryData.push({ A: `  ${customer}:`, B: count });
            });

            // Append summary to worksheet
            XLSX.utils.sheet_add_json(worksheet, summaryData, {
                skipHeader: true,
                origin: startRow
            });
        }

        function displayStats(statusPCount, testStats) {
            let html = `
                <div class="stat-card">
                    <h4>STATUS = "P"</h4>
                    <div class="number">${statusPCount}</div>
                </div>
            `;

            // Sort tests by count (descending)
            const sortedTests = Object.entries(testStats)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 6); // Show top 6 tests

            sortedTests.forEach(([testName, count]) => {
                html += `
                    <div class="stat-card">
                        <h4>${testName}</h4>
                        <div class="number">${count}</div>
                    </div>
                `;
            });

            stats.innerHTML = html;
        }
    </script>
</body>
</html>
